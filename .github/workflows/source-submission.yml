name: Source submission to draft PR

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  build-pr:
    if: github.event.label.name == 'source-approved' && contains(github.event.issue.labels.*.name, 'new-source')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Parse issue form
        id: issue-parser
        uses: stefanbuck/github-issue-parser@cb6e97157cbf851e3a393ff8d57c93a484cc323f # v3
        with:
          issue-body: ${{ github.event.issue.body }}
          template-path: .github/ISSUE_TEMPLATE/new-source.yml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Build catalog entry
        id: build-entry
        env:
          ISSUEFORM_JSON: ${{ steps.issue-parser.outputs.jsonString }}
        run: node scripts/issue-to-entry.mjs

      - name: Regenerate public API mirror
        run: node scripts/build-api.mjs

      - name: Run complete quality gate
        run: npm run check

      - name: Open draft pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          commit-message: "Add source: ${{ steps.build-entry.outputs.title }}"
          branch: "source-issue-${{ github.event.issue.number }}"
          title: "New source: ${{ steps.build-entry.outputs.title }}"
          body: |
            Auto-generated from #${{ github.event.issue.number }} by the source-submission workflow.

            Closes #${{ github.event.issue.number }}

            This has passed the automated quality gate but **not** editorial review — check the category, access note, translations, and description against CONTRIBUTING.md before merging.
          draft: true
          labels: |
            new-source
            needs-review

      - name: Link PR on the issue
        if: steps.cpr.outputs.pull-request-number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Opened draft PR #${{ steps.cpr.outputs.pull-request-number }} for review — thanks for the submission!"
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for the submission — an automated check didn't pass, so no PR was opened yet. This usually means a required field was left blank or a dropdown answer didn't match exactly. A maintainer will take a look."
            });
